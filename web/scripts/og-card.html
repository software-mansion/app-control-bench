<!doctype html>
<!-- Source for static/og.png — the 1200x630 social card linked by og:image / twitter:image.
     Rendered to PNG by scripts/render-og.sh; that script is NOT part of `npm run build`, since the
     card is static content that only changes when this file does.

     Every colour comes from theme.css, so the card cannot drift from the site's hero. The pixel
     sizes below are deliberately raw: this document renders at exactly one size (1200x630) and its
     geometry is raster layout, not theme. check_theme.py walks runner/ and web/src/
     only, so nothing here is exempted from a guard that would otherwise apply. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AppControlBench</title>
    <link rel="stylesheet" href="../../runner/theme.css" />
    <style>
      @font-face {
        font-family: 'VT323';
        font-style: normal;
        font-weight: 400;
        src: url('../src/styles/fonts/VT323-Regular.ttf') format('truetype');
      }
      @font-face {
        font-family: 'DM Sans';
        font-style: normal;
        font-weight: 100 1000;
        src: url('../src/styles/fonts/dm-sans-variable.woff2') format('woff2');
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      .card {
        position: relative;
        overflow: hidden;
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 76px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: var(--hero-bg);
        color: var(--hero-copy-fg);
        font-family: var(--grotesque, 'DM Sans'), Arial, sans-serif;
      }

      /* The same vignette the live hero lays over its dithered field. With no field underneath it
         reads as a soft corner falloff, which is what keeps the card from looking like flat black. */
      .card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--hero-vignette);
        pointer-events: none;
      }

      .card > * {
        position: relative;
        z-index: 1;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 20px;
        letter-spacing: 0.02em;
        color: var(--hero-copy-fg);
      }

      .brand svg {
        width: 74px;
        height: 40px;
        filter: brightness(0) invert(1);
        opacity: 0.72;
      }

      h1 {
        margin: 0;
        font-family: 'VT323', var(--hero-font);
        font-size: 132px;
        font-weight: var(--fw-normal, 400);
        line-height: 1;
        letter-spacing: 0.01em;
        text-shadow: var(--hero-title-shadow);
      }

      .lead {
        max-width: 760px;
        margin: 28px 0 0;
        font-size: 32px;
        line-height: 1.4;
        color: var(--hero-lead);
        text-shadow: var(--hero-copy-shadow);
      }

      .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 26px;
        border-top: 1px solid var(--hero-rule);
        font-size: 21px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--hero-muted);
      }

      .cta {
        padding: 12px 18px;
        border: 1px solid var(--hero-copy-fg);
        color: var(--hero-copy-fg);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="brand">
        Created by
        <svg
          viewBox="0 0 122 66"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          role="img"

      </p>

      <div>
        <h1>AppControlBench</h1>
        <p class="lead">
          Compare models, tools, cost, and test runs across real iOS app-control tasks.
        </p>
      </div>

      <p class="foot">
        <span>appcontrolbench.swmansion.com</span>
        <span class="cta">Explore the results →</span>
      </p>
    </div>
  </body>
</html>
